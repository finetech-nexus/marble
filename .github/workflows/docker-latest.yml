name: Docker latest

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout api
        run: |
          sha=$(git rev-parse HEAD:api)
          rm -rf api
          git clone https://github.com/finetech-nexus/marble-backend.git api
          git -C api checkout "$sha"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: ghcr.io/finetech-nexus/marble-backend:latest
          build-args: |
            MARBLE_VERSION=v1.12.0

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout frontend
        run: |
          sha=$(git rev-parse HEAD:front)
          rm -rf front
          git clone https://github.com/finetech-nexus/marble-frontend.git front
          git -C front checkout "$sha"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: front
          push: true
          tags: ghcr.io/finetech-nexus/marble-frontend:latest
