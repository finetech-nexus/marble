name: Docker latest

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_ORGANIZATION: ${{ vars.DOCKER_ORGANIZATION || 'nexusbank' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout api
        run: |
          sha=$(git rev-parse HEAD:api)
          rm -rf api
          git clone https://github.com/finetech-nexus/marble-backend.git api
          git -C api checkout "$sha"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Git short SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: |
            ${{ env.DOCKER_ORGANIZATION }}/marble-backend:latest
            ${{ env.DOCKER_ORGANIZATION }}/marble-backend:${{ steps.sha.outputs.short_sha }}
          build-args: |
            MARBLE_VERSION=v1.12.0

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout frontend
        run: |
          sha=$(git rev-parse HEAD:front)
          rm -rf front
          git clone https://github.com/finetech-nexus/marble-frontend.git front
          git -C front checkout "$sha"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Git short SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: front
          push: true
          tags: |
            ${{ env.DOCKER_ORGANIZATION }}/marble-frontend:latest
            ${{ env.DOCKER_ORGANIZATION }}/marble-frontend:${{ steps.sha.outputs.short_sha }}
